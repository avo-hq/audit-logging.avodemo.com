development:
  adapter: async

test:
  adapter: test

# The chat's answers arrive over Action Cable. The demo runs as one Puma process with its jobs inside it, so the
# in-process adapter reaches every page. Set REDIS_URL once it runs as more than one process.
production:
<% if ENV["REDIS_URL"].present? %>
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: audit_logging_avodemo_com_production
<% else %>
  adapter: async
<% end %>
